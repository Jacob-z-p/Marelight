services:
  redis:
    image: redis:7-alpine
    container_name: marelight-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:26379:6379"
    command: redis-server --appendonly yes --requirepass marelight
    volumes:
      - marelight-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "marelight", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  marelight-redis-data:
