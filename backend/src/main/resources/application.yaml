server:
  port: 8081
spring:
  application:
    name: jacobzp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/marelight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 26379
      password: marelight
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段
    use-jackson2-defaults: true
mybatis-plus:
  type-aliases-package: com.jacobzp.entity # 别名扫描包
logging:
  level:
    com.jacobzp: debug
